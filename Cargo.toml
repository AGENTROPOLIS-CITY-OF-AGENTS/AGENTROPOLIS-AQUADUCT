[workspace]
members = [
  "crates/aqueduct-core",
  "crates/aqueduct-policy",
  "crates/aqueduct-receipts",
  "crates/aqueduct-gateway",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AGENTROPOLIS-CITY-OF-AGENTS/AGENTROPOLIS-AQUADUCT"
rust-version = "1.85"

[workspace.dependencies]
axum = { version = "0.8", features = ["json"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
